name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag created after CI succeeds
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify release tag
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          RELEASE_TAG="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || {
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          }
          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$TAG_VERSION" = "$PACKAGE_VERSION" || {
            echo "Tag version $TAG_VERSION does not match package version $PACKAGE_VERSION"
            exit 1
          }
          git merge-base --is-ancestor "$RELEASE_TAG" origin/main || {
            echo "Release tag must point to a commit reachable from main"
            exit 1
          }
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run pack:check
      - name: Publish package
        env:
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          RELEASE_TAG="${RELEASE_TAG_INPUT:-${GITHUB_REF_NAME}}"
          if [[ "$RELEASE_TAG" == *-* ]]; then DIST_TAG=next; else DIST_TAG=latest; fi
          npm publish --access public --tag "$DIST_TAG"
